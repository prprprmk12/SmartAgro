services:
  # ── Backend API (Node.js + Express + MongoDB) ──────────────────────────────
  - type: web
    name: smartagro-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # вводится вручную в Render Dashboard
      - key: MONGODB_DB
        value: smartagro
      - key: OPENAI_API_KEY
        sync: false          # вводится вручную
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  # ── Frontend (React + Vite → Static Site) ─────────────────────────────────
  - type: web
    name: smartagro-frontend
    runtime: static
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # После деплоя backend замени на реальный URL, например:
        # https://smartagro-api.onrender.com
        sync: false
