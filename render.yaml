# Trial deployment. Free services sleep; Free PostgreSQL expires after 30 days.
# For continuous CDSE scheduling, choose paid plans for both resources.
services:
  - type: web
    name: smartagro-web
    runtime: docker
    repo: https://github.com/prprprmk12/SmartAgro
    branch: main
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: smartagro-db
          property: connectionString
      - key: CDSE_AUTO_SYNC
        value: "true"
      - key: CDSE_AUTO_SYNC_HOURS
        value: "24"

databases:
  - name: smartagro-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
